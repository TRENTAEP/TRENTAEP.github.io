<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quests</title>

<style>
body{
background:#0d0d0d;
font-family:Arial;
color:white;
margin:0;
}

h1{
text-align:center;
margin-top:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:30px;
}

.quest{
background:#1b1b1b;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 0 15px rgba(255,255,255,.1);
}

.reward{
color:#00ff88;
font-size:22px;
margin:15px 0;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
background:#00bfff;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0099cc;
}
</style>

</head>

<body>

<h1>📋 QUESTS</h1>

<div class="grid">

<div class="quest">
<h2>👤 Follow TikTok</h2>
<div class="reward">+2 Points</div>
<button>Claim</button>
</div>

<div class="quest">
<h2>❤️ Like Video</h2>
<div class="reward">+1 Point</div>
<button>Claim</button>
</div>

<div class="quest">
<h2>📲 Share To Story</h2>
<div class="reward">+1 Point</div>
<button>Claim</button>
</div>

<div class="quest">
<h2>💬 Comment</h2>
<div class="reward">+1 Point</div>
<button>Claim</button>
</div>

<div class="quest">
<h2>👥 Invite Friend</h2>
<div class="reward">+5 Points</div>
<button>Claim</button>
</div>

<div class="quest">
<h2>🎁 Daily Reward</h2>
<div class="reward">+1 Point</div>
<button>Claim</button>
</div>

</div>

</body>
</html>
