<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>תיק עבודות</title>

    <style>
        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 50px;
            margin-top: 50px;
        }

        .back {
            display: inline-block;
            margin: 20px;
            padding: 12px 25px;
            background: #d90000;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        .portfolio {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .project {
            background: #111;
            padding: 12px;
            border-radius: 15px;
        }

        video {
            width: 100%;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <h1>תיק עבודות</h1>

    <a href="index.html" class="back">← חזרה</a>

    <div class="portfolio">

        <div class="project">
            <video controls>
                <source src="edit1.mp4" type="video/mp4">
            </video>
        </div>

        <div class="project">
            <video controls>
                <source src="edit2.mp4" type="video/mp4">
            </video>
        </div>

        <div class="project">
            <video controls>
                <source src="edit3.mp4" type="video/mp4">
            </video>
        </div>

    </div>

</body>
</html>
